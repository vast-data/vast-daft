[project]
name = "vast-daft"
version = "0.1.1"
description = "Daft custom connector (DataSource/DataSink) for VastDB"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ofer Helman", email = "ofer.helman@vastdata.com" }]
dependencies = [
  "daft==0.7.10",
  "numpy<2",
  "vastdb>=1.2",
  "pyarrow>=15.0",
  "ibis-framework>=9.0",
]

[project.urls]
Homepage = "https://github.com/vast-data/vast-daft"
Repository = "https://github.com/vast-data/vast-daft"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "pyright>=1.1",
  # "ty>=0.0.0a1",
  "python-dotenv>=1.0",
  "ray==2.53.0",
  "pylance>=0.39.0",
  "pyiceberg[s3fs,sql-sqlite]>=0.11.1",
]
examples = [
  "python-dotenv>=1.0",
]

[project.entry-points."daft_sql_ep.catalogs"]
vastdb = "vast_daft.sql_ep:VastDBProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unsupported-operator = "ignore"


# Hybrid CI: external-repo template (trufflehog + GitHub sync on `public`) plus
# internal `sync-public-branch` on `main`. 
#
# Workflow: dev on `main` → filter to `public` → sync `public` to GitHub.
#
# Required CI/CD variable (Settings > CI/CD > Variables), masked:
#   PUBLIC_SYNC_TOKEN  - Project Access Token (role: Maintainer, scope: write_repository)
# The `public` branch must be unprotected (or allow force-push for the token's
# role), since each sync replaces it with filtered history.

include:
  - project: devops/ci-templates
    ref: main
    file: /templates/external-repo.gitlab-ci.yml

stages:
  - security
  - deploy
  - sync
  - publish

sync-public-branch:
  stage: deploy
  tags:
    - code-builder-small-shell-generic-oci
  needs:
    - job: trufflehog-scan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 -m pip install --user --quiet git-filter-repo
    - export PATH="$HOME/.local/bin:$PATH"
    - git config user.email "ci@vastdata.com"
    - git config user.name "vast-daft CI"
    - bash scripts/sync-public-branch.sh "$CI_COMMIT_SHA" public
    - git remote set-url origin "https://oauth2:${PUBLIC_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push -f origin public

# Also scan internal `main` before rebuilding the public mirror.
trufflehog-scan:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG

# Tags on `main` would expose internal paths on GitHub; disable until filtered
# tag handling exists.
sync-tag-to-github:
  rules:
    - when: never

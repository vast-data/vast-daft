include:
  - project: devops/ci-templates
    ref: main
    file: /templates/external-repo.gitlab-ci.yml
  - local: ci/daft-sql-ep.gitlab-ci.yml

stages:
  - security
  - test
  - build
  - deploy
  - sync
  - publish

test-polaris-packages:
  stage: test
  tags:
    - code-builder-small-shell-generic-oci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - python3 -m pip install --user --quiet uv
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --package polaris-client --extra dev
    - uv run --package polaris-client ruff check packages/polaris-client
    - uv run --package polaris-client pyright packages/polaris-client/src packages/polaris-client/tests
    - uv run --package polaris-client pytest packages/polaris-client/tests
    - uv sync --package polaris-daft-catalog --extra dev
    - uv run --package polaris-daft-catalog ruff check packages/polaris-daft-catalog
    - uv run --package polaris-daft-catalog pyright packages/polaris-daft-catalog/src packages/polaris-daft-catalog/tests
    - uv run --package polaris-daft-catalog pytest packages/polaris-daft-catalog/tests


include:
  - project: devops/ci-templates
    ref: main
    file: /templates/external-repo.gitlab-ci.yml

stages:
  - security
  - deploy
  - sync
  - publish

sync-public-branch:
  stage: deploy
  tags:
    - code-builder-small-shell-generic-oci
  needs:
    - job: trufflehog-scan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 -m pip install --user --quiet git-filter-repo
    - export PATH="$HOME/.local/bin:$PATH"
    - git config user.email "ci@vastdata.com"
    - git config user.name "vast-daft CI"
    - bash scripts/sync-public-branch.sh "$CI_COMMIT_SHA" public
    - git remote set-url origin "https://oauth2:${PUBLIC_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push -f origin public

trufflehog-scan:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG

sync-branch-to-github:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//

verify-public-tag:
  stage: sync
  variables:
    GIT_DEPTH: "0"
  tags:
    - code-builder-small-shell-generic-oci
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - git fetch origin public
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/public"; then
        echo "ERROR: Tag $CI_COMMIT_TAG must point to a commit on the public branch."
        exit 1
      fi

sync-tag-to-github:
  needs:
    - job: trufflehog-scan
    - job: verify-public-tag
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"

publish-to-pypi:
  needs:
    - job: trufflehog-scan
    - job: verify-public-tag
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $PYPI_PUBLISH == "true"
  script:
    - pip install uv --index-url https://${ARTIFACTORY_USER}:${ARTIFACTORY_PASSWORD}@${ARTIFACTORY_URL#https://}/artifactory/api/pypi/pypi-mirror/simple
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/vast-daft/pyproject.toml','rb'))['project']['version'])")
      if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
        echo "ERROR: Tag $CI_COMMIT_TAG ($TAG_VERSION) != pyproject ($PKG_VERSION)"
        exit 1
      fi
    - uv build --package vast-daft
    - uv publish --token "$PYPI_TOKEN" dist/*

# Rebuilds the `public` mirror branch from `main` on every change, containing
# only the paths in .github_target_paths.txt, then pushes it back to this repo.
# DevOps mirrors GitLab `public` -> GitHub `main` verbatim (no path filtering).
#
# Required CI/CD variable (Settings > CI/CD > Variables), masked:
#   PUBLIC_SYNC_TOKEN  - Project Access Token (role: Maintainer, scope: write_repository)
# The `public` branch must be unprotected (or allow force-push for the token's
# role), since each sync replaces it with a fresh orphan commit.

sync-public-branch:
  stage: deploy
  image: alpine/git:latest
  tags:
    - code-builder-small-shell-generic-oci
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash
  script:
    - git config user.email "ci@vastdata.com"
    - git config user.name "vast-daft CI"
    - bash scripts/sync-public-branch.sh "$CI_COMMIT_SHA" public
    - git remote set-url origin "https://oauth2:${PUBLIC_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push -f origin public

[project]
name = "vast-daft"
version = "0.1.0"
description = "Daft custom connector (DataSource/DataSink) for VastDB"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ofer Helman", email = "ofer.helman@vastdata.com" }]
dependencies = [
  "adbc-driver-manager>=1.0",
  "daft[ray]>=0.7.5",
  "getdaft>=0.4",
  "ibis-framework>=9.0",
  "pyarrow>=15.0",
  "pyiceberg[s3fs,sql-sqlite]>=0.11.1",
  "vastdb>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "ty>=0.0.0a1",
  "python-dotenv>=1.0",
]
examples = [
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unsupported-operator = "ignore"

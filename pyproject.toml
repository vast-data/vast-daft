[project]
name = "vast-daft"
version = "0.1.0"
description = "Daft custom connector (DataSource/DataSink) for VastDB"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ofer Helman", email = "ofer.helman@vastdata.com" }
]
requires-python = ">=3.12"
dependencies = [
    "getdaft>=0.4",
    "vastdb>=1.2",
    "pyarrow>=15.0",
    "adbc-driver-manager>=1.0",
    "ibis-framework>=9.0",
    "daft[ray]>=0.7.5",
    "pyiceberg[s3fs,sql-sqlite]>=0.11.1",
]

[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
